services:
  - type: web
    name: vidgoo
    runtime: python
    plan: free
    numInstances: 1
    buildCommand: |
      set -e
      ffmpeg -version
      ffprobe -version
      python -m pip install -r requirements.txt
      python -m yt_dlp --version
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
